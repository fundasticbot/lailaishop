function calendarWeekSegments(weekStart, data){

    const s=bs>weekStart?new Date(bs):new Date(weekStart);
    const e=be<weekEnd?new Date(be):new Date(weekEnd);
    if(e<s)return;
    const startCol=Math.round((s-weekStart)/86400000)+1;
    const endCol=Math.round((e-weekStart)/86400000)+1;
    out.push({...b,startCol,span:endCol-startCol+1,showText:s.getTime()===bs.getTime(),segStart:s.getTime()===bs.getTime(),segEnd:e.getTime()===be.getTime(),type});
  };

    if(d>=weekStart&&d<=weekEnd)addSegment(b,d,d,'Grooming');
  });

  out.sort((a,b)=>a.startCol-b.startCol||calendarMinutes(a.time,0)-calendarMinutes(b.time,0)||a.endCol-b.endCol||String(a.id).localeCompare(String(b.id)));

    html+=`<div class="calHourRow"><div class="calHourLabel">${String(hour).padStart(2,'0')}:00</div><div class="calHourSlot" onclick="dashboardDateClick('${key}')">`;
    matching.forEach(x=>{const status=String(x.status||'').toUpperCase(),cls=status==='COMPLETED'?' completed':(status==='CANCELLED'?' cancelled':'');const time=x.type==='Boarding'?(x.start===key?(x.time||'Check-in'):'00:00 · Ongoing'):(x.time||'');const sourceList=x.type==='Boarding'?D.boarding:D.bookings;const sourceRec=sourceList.find(b=>String(x.type==='Boarding'?b.boarding_id:b.booking_id)===String(x.id))||{};const custRec=D.customers.find(c=>String(c.customer_id)===String(sourceRec.customer_id))||{};const serviceRec=D.services.find(v=>String(v.service_id)===String(sourceRec.service_id))||{};const fullDate=x.type==='Boarding'?`${x.start} to ${x.end}`:x.date;const title=[x.type,`Pet: ${x.pet||'—'}`,`Customer: ${custRec.name||'—'}`,`Date: ${fullDate}`,`Time: ${time||'—'}`,serviceRec.name?`Service: ${serviceRec.name}`:'',`Status: ${x.status||'—'}`,x.message?`Notes: ${x.message}`:''].filter(Boolean).join('\n');html+=`<button type="button" class="calHourEvent${cls}" title="${esc(title)}" aria-label="${esc(title)}" style="--booking-color:${esc(x.color)};--booking-bg:${esc(bookingColorBg(x.color))}" onclick="event.stopPropagation();dashboardBookingClick('${esc(x.type)}','${esc(x.id)}')"><b>${esc(time||x.type)}</b> · ${esc(x.pet||x.type)}${x.type==='Boarding'?' · Boarding':''}${x.message?' — '+esc(x.message):''}</button>`;});
    html+='</div></div>';
  }
  html+='</div><div class="muted calHint">Each event appears once at its start time. Multi-day boarding already in progress appears at 00:00. Select a booking to view details, or tap an hour to add a booking.</div>'; 
  el.innerHTML=html;
}
function calendarMinutes(time,fallback){const m=String(time||'').match(/^([0-2]\d):([0-5]\d)$/);return m?Math.min(1440,Number(m[1])*60+Number(m[2])):fallback;}

function dashboardDateClick(date){const safe=esc(date),filter=String(dashboardCalendarFilter||'ALL').toUpperCase();if(filter==='BOARDING'){newBoarding('',safe);return;}if(filter==='GROOMING'){newBooking('',safe);return;}modal(`<button type=button class=modalClose onclick=closeModal() aria-label=Close>×</button><h2>Add Booking</h2><p>Choose the session for <b>${safe}</b>.</p><div class=card style=margin:10px 0><button class=primary style=width:100%;margin-bottom:8px onclick="closeModal();newBooking('', '${safe}')">✂️ Add Grooming</button><button class=secondary style=width:100% onclick="closeModal();newBoarding('', '${safe}')">🏠 Add Boarding</button></div><button onclick="closeModal()">Cancel</button>`);}

async function hydrateBookingPhotos(photos){for(let i=0;i<photos.length;i++){const img=document.getElementById('detail_photo_existing_'+i);if(!img)continue;const url=String(photos[i]||'');if(!url)continue;try{img.src=url;img.removeAttribute('data-photo-url');img.alt='Session photo';img.title='Session photo';}catch(e){}try{const data=await gs('getPhotoData',url);if(data){img.src=data;img.alt='Session photo';img.title='Session photo';}}catch(e){img.alt='Session photo';img.title='Stored photo';}img.onerror=function(){this.alt='Photo unavailable';this.title='Photo unavailable';};}}

function showBookingDetails(type,id){const linkedSaleId=findBookingSaleId(type,id),isBoard=type==='Boarding',rec=(isBoard?D.boarding:D.bookings).find(x=>String(x[isBoard?'boarding_id':'booking_id'])===String(id));if(!rec)return;const pet=D.pets.find(x=>x.pet_id===rec.pet_id)||{},cust=D.customers.find(x=>x.customer_id===rec.customer_id)||{},photos=petPhotos(rec.photo_url),service=D.services.find(x=>x.service_id===rec.service_id);window.__detailType=type;window.__detailId=id;window.__removedDetailPhotos=[];window.__detailPendingPhotos=[];modal(`<h2>${esc(type)} Booking Details</h2><div class=card><b>${esc(pet.name||'Pet')}</b>${petStickyNoteHtml(pet)}<br>${esc(cust.name||'')} ${cust.phone?'· '+esc(cust.phone):''}<br>${isBoard?`Check in: ${esc(displayDateTime(rec.check_in||''))}<br>Check out: ${esc(displayDateTime(rec.check_out||''))}<br>Room: ${esc(rec.room||'')}<br>Feeding: ${esc(rec.feeding||'')}<br>Care notes: ${esc(rec.care_notes||'')}<br>Created: ${esc(displayDateTime(rec.created_at||''))}`:`Service: ${esc(service?.name||rec.service_id||'')}<br>Start: ${esc(displayDateTime(rec.start_at||''))}<br>End: ${esc(displayDateTime(rec.end_at||''))}<br>Notes: ${esc(rec.notes||'')}<br>Created: ${esc(displayDateTime(rec.created_at||''))}`}<br><br><label>Status<select id=detail_status><option value=BOOKED ${String(rec.status)==='BOOKED'?'selected':''}>Booked</option><option value=IN_PROGRESS ${String(rec.status)==='IN_PROGRESS'?'selected':''}>In progress</option><option value=COMPLETED ${String(rec.status)==='COMPLETED'?'selected':''}>Completed</option><option value=CANCELLED ${String(rec.status)==='CANCELLED'?'selected':''}>Cancelled</option></select></label>${bookingColorControls(bookingColor(rec))}<label>Message<textarea id=detail_message>${esc(rec.message||'')}</textarea></label><button class=secondary type=button onclick=sendBookingWA()>WA</button>${linkedSaleId?`<button class=secondary type=button onclick="showSaleDetails('${esc(linkedSaleId)}')">Receipt</button>`:''}<label>Add photos<input id=detail_photo type=file accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="uploadDetailPhotos(this)"></label>${detailPhotoGalleryHtml(photos)}<div id=detail_photo_status class=muted></div></div><div class=row>${String(rec.status||'').toUpperCase()==='COMPLETED'?'<span class=muted style="padding:8px 0">Checked out</span>':`<button class=primary onclick="bookingCheckout('${esc(type)}','${esc(id)}')">Checkout</button>`}<button class=primary onclick="guardClick(this,saveBookingDetails)">Save Details</button><button class=secondary onclick="${isBoard?`newBoarding('${esc(id)}')`:`newBooking('${esc(id)}')`}">Edit Full Booking</button><button style="background:#b00020;color:#fff" onclick="guardClick(this,()=>deleteBookingRecord('${esc(type)}','${esc(id)}'))">Delete Booking</button><button onclick="closeModal()">Close</button></div>`);}

function isApprovedPhotoUrl(u){return /^https:\/\/drive\.google\.com\/thumbnail\?id=[A-Za-z0-9_-]+(?:&sz=w[1-9]\d{0,3})?$/.test(String(u||'').trim())}
function photoRemoveButtonHtml(url,kind){return `<button type=button data-remove-photo="${esc(kind)}" data-photo-url="${esc(url)}" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#b00020;color:#fff;cursor:pointer;line-height:1">×</button>`}
function detailPhotoGalleryHtml(photos){const safe=(Array.isArray(photos)?photos:[]).filter(isApprovedPhotoUrl);return `<div class=muted>Photos</div><div id=detail_existing style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0">${safe.map(u=>`<div style="position:relative;display:inline-block"><img class=photoPreview src="${esc(u)}" alt="Session photo">${photoRemoveButtonHtml(u,'detail')}</div>`).join('')}</div>`;}
function appendDetailUploadedPhotos(urls){const box=document.getElementById('detail_existing');if(!box)return;(Array.isArray(urls)?urls:[]).filter(isApprovedPhotoUrl).forEach(u=>{const wrap=document.createElement('div');wrap.style.cssText='position:relative;display:inline-block';const img=document.createElement('img');img.className='photoPreview';img.alt='Session photo';img.src=u;const btn=document.createElement('button');btn.type='button';btn.textContent='×';btn.dataset.removePhoto='detail';btn.dataset.photoUrl=u;btn.style.cssText='position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#b00020;color:#fff;cursor:pointer;line-height:1';wrap.append(img,btn);box.appendChild(wrap);});}
function initPhotoRemovalDelegation(){if(document.documentElement.dataset.photoRemovalDelegated==='1')return;document.documentElement.dataset.photoRemovalDelegated='1';document.addEventListener('click',e=>{const btn=e.target?.closest?.('[data-remove-photo]');if(!btn)return;const url=String(btn.dataset.photoUrl||'');if(!isApprovedPhotoUrl(url))return;const kind=String(btn.dataset.removePhoto||btn.getAttribute('data-remove-photo')||'');if(kind==='pet')removeExistingPetPhoto(url,btn);else if(kind==='booking')removeRecordPhoto(url,btn,'booking');else if(kind==='boarding')removeRecordPhoto(url,btn,'boarding');else if(kind==='detail')removeDetailPhoto(url,btn);});}
initPhotoRemovalDelegation();
async function uploadDetailPhotos(input){const files=Array.from(input?.files||[]);if(!files.length)return;const bad=files.find(f=>f.size>5*1024*1024);if(bad){alert('Image "'+bad.name+'" is too large. Maximum 5 MB.');input.value='';return;}const st=document.getElementById('detail_photo_status');if(st)st.textContent='Uploading '+files.length+' photo(s)…';try{const uploaded=await Promise.all(files.map(f=>uploadImageFile(f,'session-photo')));window.__detailPendingPhotos=(window.__detailPendingPhotos||[]).concat(uploaded);appendDetailUploadedPhotos(uploaded);if(st)st.textContent=uploaded.length+' photo(s) added. Save Details to keep changes.';input.value='';}catch(e){if(st)st.textContent='Photo upload failed: '+(e?.message||e);alert(e?.message||e);}}
function removeDetailPhoto(url,btn){const pending=window.__detailPendingPhotos||[];if(pending.includes(url)){window.__detailPendingPhotos=pending.filter(u=>u!==url);gs('deletePhoto',url).catch(()=>null);}else{window.__removedDetailPhotos=window.__removedDetailPhotos||[];window.__removedDetailPhotos.push(url);}btn.closest('div')?.remove();}
function waPhone_(phone){let n=String(phone||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('0'))n='60'+n.slice(1);return n;}
function sendBookingWA(){const isBoard=window.__detailType==='Boarding',rec=(isBoard?D.boarding:D.bookings).find(x=>String(x[isBoard?'boarding_id':'booking_id'])===String(window.__detailId));if(!rec)return;const c=D.customers.find(x=>x.customer_id===rec.customer_id)||{},p=D.pets.find(x=>x.pet_id===rec.pet_id)||{};const phone=waPhone_(c.phone);const msg=String(v('detail_message')||'').trim();if(!phone)return alert('Customer phone number is missing.');if(!msg)return alert('Enter a message first.');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');}
async function saveBookingDetails(){const isBoard=window.__detailType==='Boarding',id=window.__detailId,list=isBoard?D.boarding:D.bookings,rec=list.find(x=>String(x[isBoard?'boarding_id':'booking_id'])===String(id));if(!rec)return;let photos=petPhotos(rec.photo_url);const removed=window.__removedDetailPhotos||[];const toDelete=removed.filter(u=>photos.includes(u));photos=photos.filter(u=>!removed.includes(u));photos=photos.concat(window.__detailPendingPhotos||[]);const payload={...rec,status:v('detail_status')||rec.status,message:v('detail_message'),calendar_color:(v('detail_color_value')||bookingColor(rec)).toLowerCase(),photo_url:JSON.stringify(photos)};const i=list.findIndex(x=>String(x[isBoard?'boarding_id':'booking_id'])===String(id));const before=i>=0?{...list[i]}:null;if(i>=0)list[i]=payload;window.__removedDetailPhotos=[];window.__detailPendingPhotos=[];closeModal();if(isBoard)boarding();else bookings();if(typeof renderDashboardCalendar==='function')renderDashboardCalendar();try{await Promise.all(toDelete.map(u=>gs('deletePhoto',u).catch(()=>null)));const saved=await gs(isBoard?'saveBoarding':'saveBooking',payload);if(i>=0)list[i]=saved;cacheWrite((cacheRead()||{}).version||'');}catch(e){if(i>=0&&before)list[i]=before;if(isBoard)boarding();else bookings();if(typeof renderDashboardCalendar==='function')renderDashboardCalendar();alert(e&&e.message?e.message:e);}}

async function deleteBookingRecord(type,id){const isBoard=type==='Boarding';const list=isBoard?D.boarding:D.bookings;const key=isBoard?'boarding_id':'booking_id';const idx=list.findIndex(x=>String(x[key])===String(id));if(idx<0)return;const rec=list[idx];if(!confirm('Delete this booking? This cannot be undone.'))return;const backup={...rec};const photos=petPhotos(rec.photo_url);list.splice(idx,1);cacheWrite((cacheRead()||{}).version||'');closeModal();if(isBoard)boarding();else bookings();if(typeof renderDashboardCalendar==='function')renderDashboardCalendar();try{await gs(isBoard?'deleteBoarding':'deleteBooking',id);Promise.all(photos.map(u=>gs('deletePhoto',u).catch(()=>null))).catch(()=>null);syncData(true).catch(()=>{});}catch(e){list.splice(idx,0,backup);cacheWrite((cacheRead()||{}).version||'');if(isBoard)boarding();else bookings();if(typeof renderDashboardCalendar==='function')renderDashboardCalendar();alert(e&&e.message?e.message:e);}}

function petStickyNoteHtml(p){const note=String(p&&p.sticky_note!=null?p.sticky_note:'').trim();if(!note)return '';return `<div class="petStickyNote" role="note">${esc(note)}</div>`;}
function customers(){document.getElementById('app').innerHTML=`<h2>Customers & Pets</h2><div class="row"><input id="custSearch" placeholder="Search name / phone / email" oninput="filterCustomers()"><button class="secondary small" type="button" onclick="openCameraScanner('customer')">📷 Scan QR</button><button class="primary small" onclick="newCustomer()">+ Customer</button></div><div id="custList"></div>`;renderCustomers(D.customers);}function renderCustomers(list){list=(list||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'}));document.getElementById('custList').innerHTML=`<table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Pets</th><th>Membership</th></tr>${list.map(c=>{let pets=D.pets.filter(p=>p.customer_id===c.customer_id&&p.active!==false).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'}));let mem=D.memberships.find(m=>m.customer_id===c.customer_id&&m.status==='ACTIVE');return `<tr onclick="customerDetail('${esc(c.customer_id)}')" style="cursor:pointer"><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email||'-')}</td><td>${pets.map(p=>esc(p.name)).join(', ')}</td><td>${mem?'<span class=pill>'+esc(mem.plan_id)+'</span>':'-'}</td></tr>`}).join('')}</table>`;}function filterCustomers(){let q=document.getElementById('custSearch').value.toLowerCase();renderCustomers(D.customers.filter(c=>`${c.name} ${c.phone} ${c.email}`.toLowerCase().includes(q)))}function customerDetail(id){const c=D.customers.find(x=>x.customer_id===id), pets=D.pets.filter(x=>x.customer_id===id&&x.active!==false);document.getElementById('app').innerHTML=`<button class=secondary onclick="customers()">← Back</button><h2>${esc(c.name)}</h2><div class=card>${c.photo_url?`<img class=photoPreview src="${esc(c.photo_url)}" alt="Customer photo" style="width:140px;height:140px">`:''}<b>${esc(c.phone)}</b><br>${esc(c.email)}<br>${esc(c.notes)}<br><br><button class=secondary onclick="newCustomer('${id}')" title="Edit" aria-label="Edit">✏️</button></div><h3>Membership</h3><div class=card>${(()=>{const today=localDateString();const ms=D.memberships.filter(m=>String(m.customer_id)===String(id));return ms.length?ms.slice().reverse().map(m=>{const p=D.plans.find(x=>String(x.plan_id)===String(m.plan_id));return `<div style="margin-bottom:8px"><b>${esc(p?.name||m.plan_id)}</b> · ${esc(m.status||'')}<br>Expiry: ${esc(m.expiry_date||'')} · Points: ${esc(m.points_balance||0)}${m.status==='ACTIVE'&&(!m.expiry_date||String(m.expiry_date).slice(0,10)>=today)?' · Active':''}</div>`}).join(''):'<span class=muted>No membership</span>'})()}<br><div style="display:flex;gap:8px;flex-wrap:wrap"><button class=secondary onclick="newMembershipForCustomer('${esc(id)}')">+ Membership</button></div></div><h3>Pets</h3><div class=grid>${pets.map(p=>{const photos=petPhotos(p.photo_url);return `<div class=card>${photos.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">${photos.map(u=>`<img class=thumb src="${esc(u)}" alt="Pet photo">`).join('')}</div>`:''}<h3>🐾 ${esc(p.name)}</h3>${esc(p.species)} · ${esc(p.breed)}<br>Weight: ${esc(p.weight_kg)} kg<br>Vaccination due: ${esc(p.vaccination_due)}<br>${petStickyNoteHtml(p)}<br>${esc(p.notes)}<br><br><button class=secondary onclick="newPet('${id}','${p.pet_id}')" title="Edit" aria-label="Edit">✏️</button> <button class=secondary onclick="guardClick(this,()=>removePet('${p.pet_id}','${id}'))">Delete</button></div>`}).join('')}</div><br><button class=primary onclick="newPet('${id}')">+ Add Pet</button>`;}async function removePet(petId,cid){if(!confirm('Delete this pet?'))return;const p=D.pets.find(x=>x.pet_id===petId);guardClick(null,()=>gs('deletePet',petId),()=>{if(p)p.active=false;customerDetail(cid);return()=>{if(p)p.active=true;customerDetail(cid);}});}function newCustomer(id=''){window.__removeCustomerPhoto=false;const c=id?(D.customers.find(x=>x.customer_id===id)||{}):{};modal(`<h2>${id?'Edit':'New'} Customer</h2><label>Name<input id=c_name value="${esc(c.name||'')}"></label><label>Phone<input id=c_phone value="${esc(c.phone||'')}"></label><label>Email<input id=c_email value="${esc(c.email||'')}"></label><label>Notes<textarea id=c_notes>${esc(c.notes||'')}</textarea></label><label>Customer photo<input id=c_photo type=file accept="image/jpeg,image/png,image/webp,image/gif" onchange="previewSinglePhoto(this,'c_photo_preview','c_photo_status')"></label>${c.photo_url?`<div class=muted>Existing photo (tap × to remove)</div><div style="position:relative;display:inline-block"><img id=c_photo_preview class=photoPreview src="${esc(c.photo_url)}" alt="Customer photo"><button type=button onclick="removeCustomerPhoto()" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#b00020;color:#fff">×</button></div>`:`<img id=c_photo_preview class=photoPreview style="display:none" alt="Customer preview">`}<div id=c_photo_status class=muted></div><button class=primary onclick="guardClick(this,()=>saveNewCustomer('${id}'))">Save</button> <button onclick="closeModal()">Cancel</button>`);}function removeCustomerPhoto(){const img=document.getElementById('c_photo_preview');if(img){img.removeAttribute('src');img.style.display='none';}const input=document.getElementById('c_photo');if(input)input.value='';window.__removeCustomerPhoto=true;const st=document.getElementById('c_photo_status');if(st)st.textContent='Photo will be removed when you save.';}async function saveNewCustomer(id=''){let photoUrl=D.customers.find(x=>x.customer_id===id)?.photo_url||'';if(window.__removeCustomerPhoto){if(photoUrl)await gs('deletePhoto',photoUrl);photoUrl='';}const f=document.getElementById('c_photo')?.files?.[0];if(f){if(f.size>5*1024*1024)throw new Error('Image is too large. Maximum 5 MB.');const data=await compressImageFile(f);if(photoUrl)await gs('deletePhoto',photoUrl);photoUrl=await gs('uploadImage',data,f.name||'customer-photo');}window.__removeCustomerPhoto=false;const payload={customer_id:id,name:v('c_name'),phone:v('c_phone'),email:v('c_email'),address:'',notes:v('c_notes'),photo_url:photoUrl};if(id){guardClick(null,()=>gs('saveCustomer',payload).then(saved=>{const j=D.customers.findIndex(x=>x.customer_id===id);if(j>=0)D.customers[j]=saved;}),()=>{const i=D.customers.findIndex(x=>x.customer_id===id);const before=i>=0?{...D.customers[i]}:null;if(i>=0)D.customers[i]={...D.customers[i],...payload};closeModal();customerDetail(id);return()=>{if(before&&i>=0)D.customers[i]=before;customerDetail(id);};});}else{const saved=await gs('saveCustomer',payload);D.customers.push(saved);closeModal();customers();}}
function newPet(cid,id=''){window.__removedPetPhotos=[];const p=id?(D.pets.find(x=>x.pet_id===id)||{}):{};const species=p.species||'Dog';const breed=p.breed||'';const opts=breedOptions(species);const known=opts.includes(breed);const breedSel=breed?(known?breed:'Others'):'';const breedOptsHtml=['<option value="">Select breed…</option>'].concat(opts.map(b=>`<option ${b===breedSel?'selected':''}>${esc(b)}</option>`)).join('');const sexRaw=String(p.sex||'').trim().toLowerCase();const sexVal=sexRaw==='male'?'Male':(sexRaw==='female'?'Female':'');const photos=petPhotos(p.photo_url).filter(isApprovedPhotoUrl);modal(`<h2>${id?'Edit':'New'} Pet</h2><label>Name<input id=p_name value="${esc(p.name||'')}"></label><label>Species<input id=p_species value="${esc(species)}" oninput="updatePetBreedOptions()"></label><label>Breed<select id=p_breed onchange="document.getElementById('p_breed_other_wrap').style.display=this.value==='Others'?'block':'none'">${breedOptsHtml}</select></label><div id=p_breed_other_wrap style="display:${breedSel==='Others'?'block':'none'}"><label>Enter breed<input id=p_breed_other value="${esc(breedSel==='Others'?breed:'')}"></label></div><label>Sex<select id=p_sex><option value="" ${sexVal===''?'selected':''}>Select…</option><option ${sexVal==='Male'?'selected':''}>Male</option><option ${sexVal==='Female'?'selected':''}>Female</option></select></label><label>Weight kg<input id=p_weight type=number value="${esc(p.weight_kg||'')}"></label><label>Vaccination due<input id=p_vax type=date value="${esc(p.vaccination_due||'')}"></label><label>Allergies<textarea id=p_allergies>${esc(p.allergies||'')}</textarea></label><label>Notes<textarea id=p_notes>${esc(p.notes||'')}</textarea></label><label>Sticky note for groomer / boarding staff<textarea id=p_sticky_note placeholder="Important handling, behavior, health or care instructions">${esc(p.sticky_note||'')}</textarea></label><label>Pet photos<input id=p_photo_pet type=file accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="previewPetPhotos(this)"></label>${photos.length?`<div class=muted>Existing photos (tap × to remove)</div><div id=p_photo_existing style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0">${photos.map(u=>`<div style="position:relative;display:inline-block"><img class=photoPreview src="${esc(u)}" alt="Pet photo"><button type=button data-remove-photo="pet" data-photo-url="${esc(u)}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#b00020;color:#fff;cursor:pointer;line-height:1">×</button></div>`).join('')}</div>`:''}<div id=p_photo_pet_new_preview style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"></div><div id=p_photo_pet_status class=muted></div><button class=primary onclick="guardClick(this,()=>saveNewPet('${cid}','${id}'))">Save</button> <button onclick="closeModal()">Cancel</button>`);}
function updatePetBreedOptions(){const sel=document.getElementById('p_breed');if(!sel)return;const current=sel.value;const opts=breedOptions(v('p_species'));sel.innerHTML=['<option value="">Select breed…</option>'].concat(opts.map(b=>`<option ${b===current?'selected':''}>${esc(b)}</option>`)).join('');const wrap=document.getElementById('p_breed_other_wrap');if(wrap)wrap.style.display=sel.value==='Others'?'block':'none';}
function removeExistingPetPhoto(url,btn){window.__removedPetPhotos=window.__removedPetPhotos||[];window.__removedPetPhotos.push(url);const wrap=btn.closest('div');if(wrap)wrap.remove();}async function saveNewPet(cid,id=''){const existing=id?(D.pets.find(x=>x.pet_id===id)||{}):{};let photos=petPhotos(existing.photo_url);const removed=window.__removedPetPhotos||[];const toDelete=removed.filter(u=>photos.includes(u));await Promise.all(toDelete.map(u=>gs('deletePhoto',u)));photos=photos.filter(u=>!removed.includes(u));const fileInput=document.getElementById('p_photo_pet');const files=fileInput&&fileInput.files?Array.from(fileInput.files):[];files.forEach(f=>{if(f.size>5*1024*1024)throw new Error('Image "'+f.name+'" is too large. Maximum 5 MB.');});const uploaded=await Promise.all(files.map(f=>uploadImageFile(f,'pet-photo')));photos=photos.concat(uploaded);window.__removedPetPhotos=[];const breedSelVal=v('p_breed'),breed=breedSelVal==='Others'?v('p_breed_other').trim():breedSelVal;const payload={pet_id:id,customer_id:cid,name:v('p_name'),species:v('p_species'),breed:breed,sex:v('p_sex'),weight_kg:v('p_weight'),vaccination_due:v('p_vax'),allergies:v('p_allergies'),temperament:existing.temperament||'',notes:v('p_notes'),sticky_note:v('p_sticky_note'),photo_url:JSON.stringify(photos)};if(id){guardClick(null,()=>gs('savePet',payload).then(saved=>{const j=D.pets.findIndex(x=>x.pet_id===id);if(j>=0)D.pets[j]=saved;}),()=>{const i=D.pets.findIndex(x=>x.pet_id===id);const before=i>=0?{...D.pets[i]}:null;if(i>=0)D.pets[i]={...D.pets[i],...payload};closeModal();customerDetail(cid);return()=>{if(before&&i>=0)D.pets[i]=before;customerDetail(cid);};});}else{const saved=await gs('savePet',payload);D.pets.push(saved);closeModal();customerDetail(cid);}}async function previewPetPhotos(input){const box=document.getElementById('p_photo_pet_new_preview');if(!box)return;const files=input&&input.files?Array.from(input.files):[];const oversized=files.find(f=>f.size>5*1024*1024);if(oversized){alert('Image "'+oversized.name+'" is too large. Maximum 5 MB.');input.value='';box.innerHTML='';return;}box.innerHTML=files.map(f=>`<img class=photoPreview src="${URL.createObjectURL(f)}" alt="New pet photo">`).join('');const st=document.getElementById('p_photo_pet_status');if(st)st.textContent=files.length?files.length+' photo(s) selected. Save Pet to upload.':'';}

function groomerPoolPage(){
  const work=Array.isArray(D.groomerWork)?D.groomerWork:[], bookings=Array.isArray(D.bookings)?D.bookings:[], pets=Array.isArray(D.pets)?D.pets:[], customers=Array.isArray(D.customers)?D.customers:[], services=Array.isArray(D.services)?D.services:[];
  const admin=['OWNER','MANAGER'].includes(String(window.__appAccount?.role||'').toUpperCase());
  const myEmail=String(petshopUser?.email||'').toLowerCase();
  if(admin&&!Array.isArray(D.groomerAssignees)&&!window.__groomerAssigneesLoading){window.__groomerAssigneesLoading=true;gs('getGroomerAssignees').then(rows=>{D.groomerAssignees=Array.isArray(rows)?rows:[];groomerPoolPage();}).catch(e=>{D.groomerAssignees=[];console.error('Could not load groomer list',e);}).finally(()=>{window.__groomerAssigneesLoading=false;});}
  const assignees=Array.isArray(D.groomerAssignees)?D.groomerAssignees:[];
  const byId={};work.forEach(w=>byId[String(w.booking_id)]=w);
  const list=bookings.filter(b=>String(b.status||'').toUpperCase()!=='CANCELLED'&&String(b.status||'').toUpperCase()!=='CANCELED').slice().sort((a,b)=>String(a.start_at||'').localeCompare(String(b.start_at||'')));
  const unclaimed=list.filter(b=>{const w=byId[String(b.booking_id)]||{};return !w.completed_at&&!w.groomer_email;});
  const claimed=list.filter(b=>{const w=byId[String(b.booking_id)]||{};return !w.completed_at&&!!w.groomer_email;});
  const done=list.filter(b=>String(byId[String(b.booking_id)]?.completed_at||'')!=='').sort((a,b)=>String(byId[String(a.booking_id)]?.completed_at||'').localeCompare(String(byId[String(b.booking_id)]?.completed_at||'')));
  const today=localDateString();
  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const partsDate=k=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(k||''));return m?new Date(+m[1],+m[2]-1,+m[3]):null};
  const shortDate=k=>{const d=partsDate(k);return d?d.getDate()+' '+MON[d.getMonth()]:''};
  const dayLabel=k=>{const d=partsDate(k);if(!d)return 'No date';const base=DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];const t=partsDate(today),diff=t?Math.round((d-t)/86400000):null;if(diff===0)return 'Today · '+base;if(diff===1)return 'Tomorrow · '+base;if(diff===-1)return 'Yesterday · '+base;return base};
  const cardHtml=(b,isOverdue)=>{const w=byId[String(b.booking_id)]||{},p=pets.find(x=>String(x.pet_id)===String(b.pet_id))||{},c=customers.find(x=>String(x.customer_id)===String(b.customer_id))||{},svc=services.find(x=>String(x.service_id)===String(b.service_id))||{};const assigned=!!w.groomer_email,own=String(w.groomer_email||'').toLowerCase()===myEmail,complete=!!w.completed_at;const dk=String(b.start_at||'').slice(0,10);const time=displayTime(b.start_at)||'--:--';const dateLabel=shortDate(dk);const photos=petPhotos(p.photo_url);const thumb=photos.length?`<img src="${esc(photos[0])}" alt="">`:(p.species==='Cat'?'🐈':p.species==='Dog'?'🐕':'🐾');const sticky=String(p.sticky_note||'').trim();
    const assignControl=admin?`<div class="gp2AssignRow"><label>${complete?'Reopen':'Groomer'}</label><select aria-label="Groomer for ${esc(p.name||'pet')}" onchange="assignGroomingPet('${esc(b.booking_id)}',this.value)"><option value="">${complete?'Choose groomer…':'Unassigned'}</option>${assignees.map(a=>`<option value="${esc(a.email)}" ${String(w.groomer_email||'').toLowerCase()===String(a.email||'').toLowerCase()?'selected':''}>${esc(a.name||a.email)}</option>`).join('')}</select></div>`:'';
    const whoLine=assigned?`<div class="gp2Who"><span class="dot" ${complete?'style="background:#2e9e6b"':''}></span>${complete?'Completed':'Claimed'} by <b>${esc(w.groomer_name||w.groomer_email||'')}</b></div>`:'';
    const baLine=complete&&w.before_photo_url&&w.after_photo_url?`<div class="gp2Ba"><figure><img src="${esc(w.before_photo_url)}" alt="Before"><figcaption>Before</figcaption></figure><figure><img src="${esc(w.after_photo_url)}" alt="After"><figcaption>After</figcaption></figure></div>`:'';
    const chips=[];if(svc.name)chips.push(`<span class="gp2Tagc">${esc(svc.name)}</span>`);if(sticky)chips.push(`<span class="gp2Tagc amber">${esc(sticky)}</span>`);if(complete)chips.push('<span class="gp2Tagc ok">Done</span>');if(isOverdue)chips.push('<span class="gp2Tagc bad">Not checked out</span>');
    const pickLine=b.end_at?`<div class="gp2Pick">Pick-up ${esc(displayListDateTime(b.end_at))}</div>`:'';
    const acts=[];
    if(!complete){if(!assigned){acts.push(`<button class="primary" type="button" onclick="event.stopPropagation();openGroomingClaim('${esc(b.booking_id)}')">🛒 Claim</button>`);}else if(own){acts.push(`<button class="primary" type="button" onclick="event.stopPropagation();openGroomingComplete('${esc(b.booking_id)}')">✅ Mark Done</button>`);}}
    else{const sid=findBookingSaleId('Grooming',b.booking_id);acts.push(`<button type="button" onclick="event.stopPropagation();${sid?`showSaleDetails('${esc(sid)}')`:`alert('Receipt not available yet.')`}">🧾 Receipt</button>`);}
    acts.push(`<button type="button" onclick="event.stopPropagation();newBooking('${esc(b.booking_id)}')">✏️ Edit</button>`);
    acts.push(`<button class="danger" type="button" onclick="event.stopPropagation();deleteBookingRecord('Grooming','${esc(b.booking_id)}')">🗑️ Delete</button>`);
    const search=[p.name,c.name,svc.name,b.booking_id,w.groomer_name,w.groomer_email,sticky].join(' ').toLowerCase();
    const cardClasses=['gp2Card',complete?'done':'',isOverdue?'overdue':''].filter(Boolean).join(' ');
    return `<div class="${cardClasses}" data-gp2-search="${esc(search)}" onclick="showBookingDetails('Grooming','${esc(b.booking_id)}')"><div class="gp2Left"><div class="gp2Time">${esc(time)}</div><div class="gp2Date">${esc(dateLabel)}</div><div class="gp2Thumb">${thumb}</div></div><div class="gp2Mid"><div class="gp2NameRow"><span class="gp2Pet">${esc(p.name||'Unknown pet')}</span><span class="gp2Owner">· ${esc(c.name||'Unknown owner')}</span></div><div class="gp2Chips2">${chips.join('')}</div>${pickLine}${whoLine}${assignControl}${baLine}</div><div class="gp2Actions">${acts.join('')}</div></div>`;
  };
  const groupsHtml=(items,desc,overFlag)=>{const map={},keys=[];items.forEach(b=>{const k=String(b.start_at||'').slice(0,10);if(!map[k]){map[k]=[];keys.push(k)}map[k].push(b)});keys.sort();if(desc)keys.reverse();return keys.map(k=>{const arr=map[k].sort((a,b)=>String(a.start_at||'').localeCompare(String(b.start_at||'')));return `<div class="gp2Day"><b>${esc(dayLabel(k))}${overFlag?' · Overdue':''}</b><span>${arr.length} appointment${arr.length===1?'':'s'}</span></div><div class="gp2Group">${arr.map(b=>cardHtml(b,overFlag)).join('')}</div>`}).join('')};
  const tab=window.__groomerPoolTab||'unclaimed';
  const from=String(window.__groomerPoolDoneFrom||''),to=String(window.__groomerPoolDoneTo||'');
  const doneFiltered=done.filter(b=>{const raw=String(byId[String(b.booking_id)]?.completed_at||'');const date=raw.slice(0,10);return (!from||date>=from)&&(!to||date<=to);});
  const doneShown=(from||to)?doneFiltered:doneFiltered.slice(0,25);
  const searchIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  let content='';
  if(tab==='claimed'){
    content=`<label class="gp2Search" style="margin-top:0">${searchIcon}<input id="claimedGroomerSearch" type="search" placeholder="Search claimed pet / customer / groomer" oninput="filterGroomerPoolCards('claimed',this.value)"></label>${claimed.length?`<div id="claimedPoolList">${groupsHtml(claimed,false,false)}</div>`:'<div class="muted" style="padding:16px 0">No claimed grooming jobs.</div>'}`;
  }else if(tab==='completed'){
    content=`<div class="groomerPoolDateRange"><label>From<input type="date" value="${esc(from)}" onchange="window.__groomerPoolDoneFrom=this.value;groomerPoolPage()"></label><label>To<input type="date" value="${esc(to)}" onchange="window.__groomerPoolDoneTo=this.value;groomerPoolPage()"></label><button type="button" class="secondary" onclick="window.__groomerPoolDoneFrom='';window.__groomerPoolDoneTo='';groomerPoolPage()">Clear dates</button></div><p class="muted">${from||to?'Showing '+doneShown.length+' completed jobs in date range.':'Showing latest '+doneShown.length+' of '+done.length+' completed jobs.'}</p><label class="gp2Search" style="margin-top:0">${searchIcon}<input id="doneGroomerSearch" type="search" placeholder="Search completed pet / customer / groomer" oninput="filterGroomerPoolCards('done',this.value)"></label>${doneShown.length?`<div id="donePoolList">${groupsHtml(doneShown,true,false)}</div>`:'<div class="muted" style="padding:16px 0">No completed grooming jobs for this date range.</div>'}`;
  }else{
    const overdue=unclaimed.filter(b=>{const k=String(b.start_at||'').slice(0,10);return k&&k<today});
    const upcoming=unclaimed.filter(b=>{const k=String(b.start_at||'').slice(0,10);return !k||k>=today});
    content=`<label class="gp2Search" style="margin-top:0">${searchIcon}<input id="unclaimedGroomerSearch" type="search" placeholder="Search pet / owner / service" oninput="filterGroomerPoolCards('unclaimed',this.value)"></label>${unclaimed.length?`<div id="unclaimedPoolList">${overdue.length?groupsHtml(overdue,false,true):''}${upcoming.length?groupsHtml(upcoming,false,false):''}</div>`:'<div class="muted" style="padding:16px 0">No unclaimed grooming jobs.</div>'}`;
  }
  document.getElementById('app').innerHTML=`<div class="gp2Pool"><div class="gp2Head"><h2>Groomer Pool</h2></div><div class="groomerPoolTabs" role="tablist" aria-label="Groomer pools"><button type="button" role="tab" aria-selected="${tab==='unclaimed'}" class="groomerPoolTab ${tab==='unclaimed'?'selected':''}" onclick="showGroomerPoolTab('unclaimed')">Unclaimed <b>${unclaimed.length}</b></button><button type="button" role="tab" aria-selected="${tab==='claimed'}" class="groomerPoolTab ${tab==='claimed'?'selected':''}" onclick="showGroomerPoolTab('claimed')">Claimed <b>${claimed.length}</b></button><button type="button" role="tab" aria-selected="${tab==='completed'}" class="groomerPoolTab ${tab==='completed'?'selected':''}" onclick="showGroomerPoolTab('completed')">Completed <b>${done.length}</b></button></div><section class="card groomerPoolPanel" role="tabpanel" style="padding:12px">${content}</section></div>`;
}

function filterGroomerPoolCards(scope,query){
  const q=String(query||'').trim().toLowerCase();
  const id=scope==='claimed'?'claimedPoolList':scope==='done'?'donePoolList':'unclaimedPoolList';
  const root=document.getElementById(id);
  if(!root)return;
  root.querySelectorAll('[data-gp2-search]').forEach(el=>{el.style.display=!q||String(el.getAttribute('data-gp2-search')||'').includes(q)?'':'none';});
  root.querySelectorAll('.gp2Day').forEach(day=>{const group=day.nextElementSibling;if(group&&group.classList.contains('gp2Group')){const visible=Array.from(group.querySelectorAll('[data-gp2-search]')).some(el=>el.style.display!=='none');day.style.display=visible?'':'none';}});
}

function showGroomerPoolTab(tab){window.__groomerPoolTab=['unclaimed','claimed','completed'].includes(tab)?tab:'unclaimed';groomerPoolPage();}
function filterGroomerPoolList(listId,query){const q=String(query||'').trim().toLowerCase();document.querySelectorAll('#'+listId+' [data-done-search]').forEach(el=>{el.style.display=!q||String(el.getAttribute('data-done-search')||'').includes(q)?'':'none';});}
function filterDoneGroomerPool(query){const q=String(query||'').trim().toLowerCase();document.querySelectorAll('#doneGroomerList [data-done-search]').forEach(el=>{el.style.display=!q||String(el.getAttribute('data-done-search')||'').includes(q)?'':'none';});}

function groomDuration_(start,end){const a=Date.parse(start||''),b=Date.parse(end||'');if(!Number.isFinite(a)||!Number.isFinite(b)||b<a)return '—';const m=Math.round((b-a)/60000);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';}
function openGroomingClaim(id){const b=(D.bookings||[]).find(x=>String(x.booking_id)===String(id));if(!b)return;const w=(D.groomerWork||[]).find(x=>String(x.booking_id)===String(id))||{};const bookingPhotos=petPhotos(b.photo_url);const before=w.before_photo_url||bookingPhotos[0]||'';modal(`<h2>Claim grooming pet</h2><p>Take or upload a <b>before</b> photo if one has not already been captured at check-in.</p>${before?`<div class=muted>Before photo already available</div><img class=photoPreview src="${esc(before)}" alt="Before grooming">`:''}<label>Before photo ${before?'(optional replacement)':'(required)'}<input id=groomBeforePhoto type=file accept="image/jpeg,image/png,image/webp,image/gif"></label><div class=row><button class=primary onclick="guardClick(this,()=>saveGroomingClaim('${esc(id)}','${esc(before)}'))">${before?'Claim pet':'Save photo & claim'}</button><button class=secondary onclick=closeModal()>Cancel</button></div>`);}
async function saveGroomingClaim(id,existingBefore){let before=existingBefore||'';const f=document.getElementById('groomBeforePhoto')?.files?.[0];if(f){if(f.size>5*1024*1024)throw new Error('Image is too large. Maximum 5 MB.');before=await uploadImageFile(f,'grooming-before');}if(!before)throw new Error('Take or upload the before photo before claiming this pet.');const savedPhotos=await gs('saveGroomingWorkPhotos',id,before,'');const claimed=await gs('claimGroomingPet',id);const merged={...claimed,...savedPhotos,before_photo_url:before};D.groomerWork=(D.groomerWork||[]).filter(x=>String(x.booking_id)!==String(id)).concat([merged]);closeModal();groomerPoolPage();}
function openGroomingComplete(id){const w=(D.groomerWork||[]).find(x=>String(x.booking_id)===String(id))||{};modal(`<h2>Complete grooming</h2><p>Take or upload an <b>after</b> photo if one has not already been captured.</p>${w.after_photo_url?`<div class=muted>After photo already available</div><img class=photoPreview src="${esc(w.after_photo_url)}" alt="After grooming">`:''}<label>After photo ${w.after_photo_url?'(optional replacement)':'(required)'}<input id=groomAfterPhoto type=file accept="image/jpeg,image/png,image/webp,image/gif"></label><div class=row><button class=primary onclick="guardClick(this,()=>saveGroomingCompletion('${esc(id)}','${esc(w.after_photo_url||'')}'))">${w.after_photo_url?'Mark Done':'Save photo & mark done'}</button><button class=secondary onclick=closeModal()>Cancel</button></div>`);}
async function saveGroomingCompletion(id,existingAfter){let after=existingAfter||'';const f=document.getElementById('groomAfterPhoto')?.files?.[0];if(f){if(f.size>5*1024*1024)throw new Error('Image is too large. Maximum 5 MB.');after=await uploadImageFile(f,'grooming-after');}if(!after)throw new Error('Take or upload the after photo before completing this job.');const savedPhotos=await gs('saveGroomingWorkPhotos',id,'',after);const done=await gs('completeGroomingPet',id);const merged={...done,...savedPhotos,after_photo_url:after};D.groomerWork=(D.groomerWork||[]).filter(x=>String(x.booking_id)!==String(id)).concat([merged]);closeModal();groomerPoolPage();}
async function claimGroomingPet(id){try{const r=await gs('claimGroomingPet',id);D.groomerWork=(D.groomerWork||[]).filter(w=>String(w.booking_id)!==String(id)).concat([r]);groomerPoolPage();}catch(e){alert(e&&e.message?e.message:e);}}
function claimAndFinishGroomingPet(id,btn){const key=String(id),before=(D.groomerWork||[]).find(w=>String(w.booking_id)===key),now=new Date().toISOString();if(btn){btn.disabled=true;btn.textContent='Finishing…';}const optimistic={booking_id:key,pet_id:(D.bookings||[]).find(b=>String(b.booking_id)===key)?.pet_id||before?.pet_id||'',groomer_email:before?.groomer_email||petshopUser?.email||'',groomer_name:before?.groomer_name||petshopUser?.name||petshopUser?.email||'',claimed_at:before?.claimed_at||now,completed_at:now,updated_at:now,updated_by:petshopUser?.email||''};D.groomerWork=(D.groomerWork||[]).filter(w=>String(w.booking_id)!==key).concat([optimistic]);groomerPoolPage();Promise.resolve().then(()=>gs('claimAndCompleteGroomingPet',key)).then(saved=>{D.groomerWork=(D.groomerWork||[]).filter(w=>String(w.booking_id)!==key).concat([saved]);if(D.__page==='groomerPool'||D.__page==='groomer-pool')groomerPoolPage();}).catch(e=>{D.groomerWork=(D.groomerWork||[]).filter(w=>String(w.booking_id)!==key);if(before)D.groomerWork.push(before);if(D.__page==='groomerPool'||D.__page==='groomer-pool')groomerPoolPage();alert('Could not finish grooming job: '+(e&&e.message?e.message:e));});}
async function assignGroomingPet(id,email){try{const r=await gs('assignGroomingPet',id,email);D.groomerWork=(D.groomerWork||[]).filter(w=>String(w.booking_id)!==String(id)).concat([r]);groomerPoolPage();}catch(e){alert(e&&e.message?e.message:e);groomerPoolPage();}}
async function completeGroomingPet(id){try{const r=await gs('completeGroomingPet',id);D.groomerWork=(D.groomerWork||[]).filter(w=>String(w.booking_id)!==String(id)).concat([r]);groomerPoolPage();}catch(e){alert(e&&e.message?e.message:e);}}

function renderGroomingBookingTable(rows,allowCheckout){return `<table class="bookingListTable groomingListTable"><tr class="bookingTableHead"><th>Photo</th><th>Date/time</th><th>Owner</th><th>Pet</th><th>Service</th><th>Message</th><th>Actions</th></tr>${rows.slice().reverse().map(b=>{const p=D.pets.find(x=>String(x.pet_id)===String(b.pet_id)),c=D.customers.find(x=>String(x.customer_id)===String(b.customer_id)),svc=D.services.find(x=>String(x.service_id)===String(b.service_id));const ph=petPhotos(b.photo_url),saleId=findBookingSaleId('Grooming',b.booking_id);return `<tr style="cursor:pointer" onclick="showBookingDetails('Grooming','${esc(b.booking_id)}')"><td data-label="Photo">${ph.length?`<img class=thumb src="${esc(ph[0])}" alt="">`:'-'}</td><td data-label="Date / time">${esc(displayListDateTime(b.start_at))}${b.end_at?`<div class=muted>to ${esc(displayListDateTime(b.end_at))}</div>`:''}</td><td data-label="Owner">${esc(c?.name||'')}</td><td data-label="Pet"><b>${esc(p?.name||'')}</b>${petStickyNoteHtml(p)}</td><td data-label="Service">${esc(svc?.name||b.service_id)}</td><td data-label="Message">${esc(b.message||'')}</td><td data-label="Actions">${allowCheckout?`<button class=primary onclick="event.stopPropagation();bookingCheckout('Grooming','${esc(b.booking_id)}')">Checkout</button> `:''}${saleId?`<button class=secondary onclick="event.stopPropagation();showSaleDetails('${esc(saleId)}')">Receipt</button> `:''}<button onclick="event.stopPropagation();newBooking('${esc(b.booking_id)}')" title="Edit" aria-label="Edit">✏️</button> <button onclick="event.stopPropagation();deleteBookingRecord('Grooming','${esc(b.booking_id)}')">Delete</button></td></tr>`}).join('')}</table>`;}
function renderBoardingBookingTable(rows,allowCheckout){return `<table class="bookingListTable boardingListTable"><tr class="bookingTableHead"><th>Photo</th><th>Owner</th><th>Pet</th><th>In / Out</th><th>Package</th><th>Room</th><th>Message</th><th>Actions</th></tr>${rows.slice().reverse().map(b=>{const p=D.pets.find(x=>String(x.pet_id)===String(b.pet_id)),c=D.customers.find(x=>String(x.customer_id)===String(b.customer_id));const ph=petPhotos(b.photo_url),saleId=findBookingSaleId('Boarding',b.boarding_id),svc=D.services.find(x=>String(x.service_id)===String(b.service_id)),room=b.room||D.boardingRooms?.find(r=>String(r.room_id)===String(b.room_id))?.name||'';return `<tr style="cursor:pointer" onclick="showBookingDetails('Boarding','${esc(b.boarding_id)}')"><td data-label="Photo">${ph.length?`<img class=thumb src="${esc(ph[0])}" alt="">`:'-'}</td><td data-label="Owner">${esc(c?.name||'')}</td><td data-label="Pet"><b>${esc(p?.name||'')}</b>${petStickyNoteHtml(p)}</td><td data-label="In / Out"><div>${esc(displayListDateTime(b.check_in))}</div><div>${esc(displayListDateTime(b.check_out))}</div></td><td data-label="Package">${esc(svc?.name||'')}</td><td data-label="Room">${esc(room)}</td><td data-label="Message">${esc(b.message||'')}</td><td data-label="Actions">${allowCheckout?`<button class=primary onclick="event.stopPropagation();bookingCheckout('Boarding','${esc(b.boarding_id)}')">Checkout</button> `:''}${saleId?`<button class=secondary onclick="event.stopPropagation();showSaleDetails('${esc(saleId)}')">Receipt</button> `:''}<button onclick="event.stopPropagation();newBoarding('${esc(b.boarding_id)}')" title="Edit" aria-label="Edit">✏️</button> <button onclick="event.stopPropagation();deleteBookingRecord('Boarding','${esc(b.boarding_id)}')">Delete</button></td></tr>`}).join('')}</table>`;}
function bookingStatusKey(b){const s=String(b.status||'').toUpperCase().replace(/[ _-]+/g,'_');if(['CANCELLED','CANCELED','CANCEL'].includes(s))return 'cancelled';if(['COMPLETED','CHECKED_OUT','CHECKEDOUT','DONE'].includes(s))return 'done';return 'active'}
function bookingStatusPanel(type,active,done,cancelled,selected='active'){
 const id=type==='Grooming'?'grooming':'boarding',rows={active,done,cancelled},labels={active:'Active',done:'Completed',cancelled:'Cancelled'};
 return `<div class="card bookingStatusBox"><div class="bookingStatusCards">${['active','done','cancelled'].map(k=>`<button type="button" class="bookingStatusCard ${selected===k?'selected':''}" onclick="showBookingStatus('${id}','${k}')"><span>${labels[k]}: <b>${rows[k].length}</b></span></button>`).join('')}</div><div id="${id}StatusContent" class="bookingStatusContent">${rows[selected].length?(type==='Grooming'?renderGroomingBookingTable(rows[selected],selected==='active'):renderBoardingBookingTable(rows[selected],selected==='active')):`<div class="muted">No ${labels[selected].toLowerCase()} ${type.toLowerCase()} orders.</div>`}</div></div>`;
}
function showBookingStatus(id,status){const type=id==='grooming'?'Grooming':'Boarding',data=type==='Grooming'?(D.bookings||[]):(D.boarding||[]),groups={active:[],done:[],cancelled:[]};data.forEach(b=>groups[bookingStatusKey(b)].push(b));const content=document.getElementById(id+'StatusContent');if(content)content.innerHTML=groups[status].length?(type==='Grooming'?renderGroomingBookingTable(groups[status],status==='active'):renderBoardingBookingTable(groups[status],status==='active')):`<div class="muted">No ${status==='done'?'completed':status==='cancelled'?'cancelled':'active'} ${type.toLowerCase()} orders.</div>`;const box=content?.closest('.bookingStatusBox');if(box){box.querySelectorAll('.bookingStatusCard').forEach(btn=>btn.classList.toggle('selected',btn.getAttribute('onclick')===`showBookingStatus('${id}','${status}')`));}}
function bookings(){dashboardCalendarFilter='GROOMING';try{localStorage.setItem('petshop_calendar_filter','GROOMING');}catch(e){}const groups={active:[],done:[],cancelled:[]};(D.bookings||[]).forEach(b=>groups[bookingStatusKey(b)].push(b));document.getElementById('app').innerHTML=`<h2>Grooming</h2><div class=card><h3>Booking Calendar</h3><div id="sectionBookingCalendar"></div></div><br><div class=row><button class=primary onclick="newBooking()">+ New Booking</button></div><br>${bookingStatusPanel('Grooming',groups.active,groups.done,groups.cancelled)}`;renderDashboardCalendar();}
function boarding(){dashboardCalendarFilter='BOARDING';try{localStorage.setItem('petshop_calendar_filter','BOARDING');}catch(e){}const groups={active:[],done:[],cancelled:[]};(D.boarding||[]).forEach(b=>groups[bookingStatusKey(b)].push(b));document.getElementById('app').innerHTML=`<h2>Boarding</h2><div class=card><div class=row><h3>Boarding Rooms</h3><button class=primary onclick="boardingRoomForm()">+ Add Room</button></div><p class=muted>Room availability is calculated from booking dates. Active bookings occupy a room until checkout or cancellation.</p>${renderBoardingRoomsTable()}</div><br><div class=card><h3>Booking Calendar</h3><div id="sectionBookingCalendar"></div></div><br><div class=row><button class=primary onclick="newBoarding()">+ New Boarding</button><button class=secondary onclick="openQuickMultiPetBooking()">Quick Multi-Pet Booking</button></div><br>${bookingStatusPanel('Boarding',groups.active,groups.done,groups.cancelled)}`;renderDashboardCalendar();}
function boardingRoomOccupied(room,checkin,checkout,excludeId=''){const start=Date.parse(checkin||''),end=Date.parse(checkout||'');if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start)return false;return (D.boarding||[]).some(b=>String(b.boarding_id)!==String(excludeId||'')&&(String(b.room_id||'')===String(room.room_id)||(!String(b.room_id||'')&&String(b.room||'').trim().toLowerCase()===String(room.name||'').trim().toLowerCase()))&&!['COMPLETED','CANCELLED','CANCELED','CHECKED_OUT','CHECKEDOUT'].includes(String(b.status||'').toUpperCase().replace(/[ _-]+/g,'_'))&&Number.isFinite(Date.parse(b.check_in||''))&&Number.isFinite(Date.parse(b.check_out||''))&&start<Date.parse(b.check_out)&&end>Date.parse(b.check_in));}
function renderBoardingRoomsTable(){const rooms=(D.boardingRooms||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));if(!rooms.length)return '<div class=muted>No boarding rooms yet. Add rooms to track vacancy and upload room photos.</div>';return `<div style="overflow-x:auto"><table><tr><th>Photo</th><th>Room</th><th>Type</th><th>Status now</th><th>Notes</th><th>Actions</th></tr>${rooms.map(r=>{const now=new Date(),iso=now.toISOString();const occupied=boardingRoomOccupied(r,iso,new Date(now.getTime()+60000).toISOString());return `<tr><td>${r.photo_url?`<img class=thumb src="${esc(r.photo_url)}" alt="Room photo">`:'-'}</td><td><b>${esc(r.name||'')}</b></td><td>${esc(r.category||'-')}</td><td><span class="pill" style="background:${occupied?'#fee2e2':'#dcfce7'};color:${occupied?'#991b1b':'#166534'}">${occupied?'Occupied':'Vacant'}</span></td><td>${esc(r.notes||'')}</td><td><button onclick="boardingRoomForm('${esc(r.room_id)}')">Edit</button> <button onclick="guardClick(this,()=>deleteBoardingRoom('${esc(r.room_id)}'))">Delete</button></td></tr>`}).join('')}</table></div>`;}
function boardingRoomForm(id=''){const r=(D.boardingRooms||[]).find(x=>String(x.room_id)===String(id))||{};window.__removeBoardingRoomPhoto=false;modal(`<h2>${id?'Edit':'Add'} Boarding Room</h2><label>Room name / number<input id=brm_name value="${esc(r.name||'')}" required placeholder="e.g. Room 01"></label><label>Room type<input id=brm_category value="${esc(r.category||'')}" placeholder="e.g. Small dog, Cat, Suite"></label><label>Notes<textarea id=brm_notes>${esc(r.notes||'')}</textarea></label><label>Room photo<input id=brm_photo type=file accept="image/jpeg,image/png,image/webp,image/gif" onchange="previewSinglePhoto(this,'brm_photo_preview','brm_photo_status')"></label>${r.photo_url?`<img id=brm_photo_preview class=photoPreview src="${esc(r.photo_url)}" alt="Room photo"><button type=button onclick="removeBoardingRoomPhoto()">Remove photo</button>`:'<img id=brm_photo_preview class=photoPreview style="display:none" alt="Room photo preview">'}<div id=brm_photo_status class=muted></div><label>Active<select id=brm_active><option value=true ${r.active!==false?'selected':''}>Yes</option><option value=false ${r.active===false?'selected':''}>No</option></select></label><button class=primary onclick="guardClick(this,()=>saveBoardingRoom('${esc(id)}'))">Save Room</button> <button onclick=closeModal()>Cancel</button>`);}
function removeBoardingRoomPhoto(){window.__removeBoardingRoomPhoto=true;const img=document.getElementById('brm_photo_preview');if(img){img.removeAttribute('src');img.style.display='none';}const input=document.getElementById('brm_photo');if(input)input.value='';const st=document.getElementById('brm_photo_status');if(st)st.textContent='Photo will be removed when saved.';}
async function saveBoardingRoom(id){const old=(D.boardingRooms||[]).find(x=>String(x.room_id)===String(id))||{};let photo=window.__removeBoardingRoomPhoto?'':String(old.photo_url||'');const f=document.getElementById('brm_photo')?.files?.[0];if(f){if(f.size>5*1024*1024)throw new Error('Room photo is too large. Maximum 5 MB.');photo=await uploadImageFile(f,f.name||'boarding-room');}const payload={room_id:id,name:v('brm_name').trim(),category:v('brm_category').trim(),notes:v('brm_notes'),photo_url:photo,active:v('brm_active')==='true'};if(!payload.name)throw new Error('Room name is required.');const saved=await gs('saveBoardingRoom',payload);D.boardingRooms=D.boardingRooms||[];const i=D.boardingRooms.findIndex(x=>String(x.room_id)===String(saved.room_id));if(i>=0)D.boardingRooms[i]=saved;else D.boardingRooms.push(saved);window.__removeBoardingRoomPhoto=false;closeModal();boarding();}
async function deleteBoardingRoom(id){if((D.boarding||[]).some(b=>String(b.room_id)===String(id)&&!['COMPLETED','CANCELLED','CANCELED','CHECKED_OUT','CHECKEDOUT'].includes(String(b.status||'').toUpperCase().replace(/[ _-]+/g,'_'))))throw new Error('Cannot delete a room with an active booking.');if(!confirm('Delete this room?'))return;await gs('deleteBoardingRoom',id);D.boardingRooms=(D.boardingRooms||[]).filter(r=>String(r.room_id)!==String(id));boarding();}
function boardingPackageOptions(selected=''){const list=sortByName((D.services||[]).filter(s=>s.active!==false&&String(s.category||'').trim().toLowerCase().includes('boarding')));return `<option value="">Select boarding package</option>${list.map(s=>`<option value="${esc(s.service_id)}" ${String(s.service_id)===String(selected)?'selected':''}>${esc(s.name)} — ${money(s.price)}</option>`).join('')}`;}
function refreshBoardingRoomOptions(){
 const start=v('br_in'),end=v('br_out'),exclude=window.__editingBoardingId||'',valid=!!start&&!!end&&Date.parse(end)>Date.parse(start),rooms=sortByName((D.boardingRooms||[]).filter(r=>r.active!==false&&String(r.active).toLowerCase()!=='false')),pets=window.__inlineBoardPets||[];
 const rows=pets.map((p,i)=>({p,i,sel:document.getElementById('br_multi_room_'+i),checked:!!document.getElementById('br_multi_pet_'+i)?.checked})).filter(x=>x.sel);
 const claimed=new Map();
 // Preserve valid existing choices first; when duplicates already exist, the first selected pet keeps the room.
 rows.forEach(x=>{const wanted=String(x.sel.value||'');if(!x.checked||!wanted||!valid)return;const room=rooms.find(r=>String(r.room_id)===wanted);if(!room||boardingRoomOccupied(room,start,end,exclude)||claimed.has(wanted)){x.sel.dataset.roomConflict=claimed.has(wanted)?'duplicate':'occupied';x.sel.value='';return;}claimed.set(wanted,x.i);x.sel.dataset.roomConflict='';});
 rows.forEach(x=>{
   const selected=String(x.sel.value||''),isChecked=x.checked;
   const available=valid?rooms.filter(r=>!boardingRoomOccupied(r,start,end,exclude)&&(!isChecked||!claimed.has(String(r.room_id))||claimed.get(String(r.room_id))===x.i)):rooms;
   const options=sortByName(available).map(r=>`<option value="${esc(r.room_id)}" ${String(r.room_id)===selected?'selected':''}>${esc(r.name)}${r.category?' · '+esc(r.category):''}</option>`).join('');
   x.sel.innerHTML='<option value="">'+(valid?'Select vacant room':'Choose dates to see rooms')+'</option>'+options;
   if(selected&&!available.some(r=>String(r.room_id)===selected))x.sel.value='';
   const hint=document.getElementById('br_multi_info_'+x.i);if(hint){const room=rooms.find(r=>String(r.room_id)===String(x.sel.value||''));hint.textContent=!valid?'Enter valid check-in and check-out times to see available rooms.':!isChecked?'Select this pet to reserve a room.':room?'Room '+room.name+' reserved for this pet.':(x.sel.dataset.roomConflict==='duplicate'?'That room is assigned to another selected pet. Choose another room.':'Choose a vacant room for '+(x.p.name||'this pet')+'.');}
 });
}

function searchAppointmentCustomers(prefix){const input=document.getElementById(prefix+'_cust_search'),sel=document.getElementById(prefix+'_cust'),box=document.getElementById(prefix+'_cust_results');if(!input||!sel||!box)return;const q=String(input.value||'').trim().toLowerCase();const activePets=D.pets.filter(p=>p.active!==false&&String(p.active).toLowerCase()!=='false').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'}));const list=D.customers.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'})).filter(c=>{const customerText=`${c.name||''} ${c.phone||''} ${c.email||''}`.toLowerCase();const pets=activePets.filter(p=>String(p.customer_id)===String(c.customer_id));return !q||customerText.includes(q)||pets.some(p=>`${p.name||''} ${p.breed||''} ${p.species||''}`.toLowerCase().includes(q));}).slice(0,40);box.innerHTML=list.map(c=>{const pets=activePets.filter(p=>String(p.customer_id)===String(c.customer_id));const visiblePets=q?pets.filter(p=>`${p.name||''} ${p.breed||''} ${p.species||''}`.toLowerCase().includes(q)||`${c.name||''} ${c.phone||''} ${c.email||''}`.toLowerCase().includes(q)):pets;return `<div class="customerSearchResult" style="display:block;text-align:left"><button type="button" class="secondary" style="width:100%;text-align:left" onclick="chooseAppointmentCustomer('${prefix}','${esc(c.customer_id)}')"><b>${esc(c.name||'Unnamed customer')}</b> · ${esc(c.phone||'No phone')}<span class="muted" style="display:block">${esc(c.email||'')}</span></button><div style="display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px">${visiblePets.map(p=>`<button type="button" class="secondary" onclick="chooseAppointmentPet('${prefix}','${esc(c.customer_id)}','${esc(p.pet_id)}')">🐾 ${esc(p.name||'Unnamed pet')}${p.breed?' · '+esc(p.breed):''}</button>`).join('')||'<span class="muted">No matching active pets</span>'}</div></div>`;}).join('')||'<div class="muted" style="padding:8px">No matching customers or pets.</div>';box.style.display='block';}function chooseAppointmentCustomer(prefix,id){const sel=document.getElementById(prefix+'_cust'),input=document.getElementById(prefix+'_cust_search'),box=document.getElementById(prefix+'_cust_results');if(!sel)return;sel.value=String(id);const c=D.customers.find(x=>String(x.customer_id)===String(id));if(input)input.value=c?`${c.name||''}${c.phone?' — '+c.phone:''}`:'';if(box)box.style.display='none';if(prefix==='b')loadBookingPets();else loadBoardPets();}function chooseAppointmentPet(prefix,customerId,petId){const sel=document.getElementById(prefix+'_cust'),input=document.getElementById(prefix+'_cust_search'),box=document.getElementById(prefix+'_cust_results');if(!sel)return;sel.value=String(customerId);const c=D.customers.find(x=>String(x.customer_id)===String(customerId)),p=D.pets.find(x=>String(x.pet_id)===String(petId));if(input)input.value=`${c?.name||'Customer'}${p?.name?' · '+p.name:''}`;if(prefix==='b')loadBookingPets(petId);else loadBoardPets(petId);if(box)box.style.display='none';}function initAppointmentCustomerSearch(prefix,customerId=''){const sel=document.getElementById(prefix+'_cust'),input=document.getElementById(prefix+'_cust_search');if(!sel||!input)return;const c=D.customers.find(x=>String(x.customer_id)===String(customerId||sel.value));input.value='';searchAppointmentCustomers(prefix);if(c)sel.value=String(c.customer_id);if(sel.value){input.value='';if(prefix==='b')loadBookingPets(c?.pet_id||'');else loadBoardPets(c?.pet_id||'');}}function openQuickMultiPetBooking(){window.__quickMultiPets=[];modal(`<button type=button class=modalClose onclick=closeModal() aria-label=Close>×</button><h2>Quick Multi-Pet Booking</h2><p class=muted>Select a customer to load all active pets. Choose a different service for each pet.</p><label>Search customer<input id=qmp_customer_search autocomplete=off placeholder="Search customer name or phone" oninput="searchQuickMultiCustomer <script id="v349-mobile-design-init">
(function(){

 var SHEET_ICONS={

  catalog:svg('<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>'),
  reports:svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  'open-orders':svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h6"/>'),
  staff:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  settings:svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'),
  sales:svg('<path d="M4 19V5m0 14h17"/><path d="m7 15 4-4 3 2 6-7"/><path d="M16 6h4v4"/>'),
  other:svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/>')
 };

   {label:'POS',icon:svg('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2m4 0h2M8 15h2m4 0h2M9 21v-3h6v3"/>'),page:'pos'},
   {label:'Customers',icon:SHEET_ICONS.customers,page:'customers'},
   {label:'Membership',icon:SHEET_ICONS.membership,page:'membership'},
   {label:'Products',icon:SHEET_ICONS.catalog,page:'catalog'},
   {label:'Reports',icon:SHEET_ICONS.reports,page:'reports'},
   {label:'Sales',icon:SHEET_ICONS.sales,page:'sales'},

<script id="modalChromeNormalizer">
(function(){
  function normalize(){
    const box=document.getElementById('modalbox');
    if(!box||box.querySelector('.modalTitleBar'))return;
    const layout=box.querySelector('.bookingFormLayout');
    if(layout){
      const head=layout.querySelector('.bookingFormHead'),foot=layout.querySelector('.bookingFormFoot');
      if(head)head.classList.add('modalTitleBar');
      if(foot)foot.classList.add('modalActionBar');
      box.dataset.modalChrome='1';
      return;
    }
    const heading=Array.from(box.children).find(e=>e.tagName==='H2');
    const close=Array.from(box.children).find(e=>e.classList&&e.classList.contains('modalClose'));
    if(!heading||!close)return;
    const head=document.createElement('div');
    head.className='modalTitleBar';
    head.append(heading,close);
    box.insertBefore(head,box.firstChild);
    const children=Array.from(box.children),actions=[];
    for(let i=children.length-1;i>=0;i--){
      const e=children[i];
      if(e.tagName==='BUTTON'&&e!==close){actions.unshift(e);continue;}
      if(actions.length)break;
    }
    if(actions.length){
      const foot=document.createElement('div');
      foot.className='modalActionBar';
      actions.forEach(e=>foot.appendChild(e));
      box.appendChild(foot);
    }
    box.dataset.modalChrome='1';
  }
  const original=window.modal;
  if(original&&!original.__modalChromeWrapped){
    const wrapped=function(){const result=original.apply(this,arguments);setTimeout(normalize,0);return result;};
    wrapped.__modalChromeWrapped=true;
    window.modal=wrapped;
  }
  document.addEventListener('DOMContentLoaded',normalize,{once:true});
})();
</script>
